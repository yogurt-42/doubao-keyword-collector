[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "doubao-keyword-collector"
version = "0.5.2"
description = "Local-first Doubao keyword research collector with isolated multi-account browsers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Doubao Account Manager contributors" }]
keywords = ["doubao", "keyword-research", "reference-collector", "playwright"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "playwright>=1.50,<2",
  "python-multipart>=0.0.9,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
  "matplotlib>=3.9,<4",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-timeout>=2,<3",
  "ruff>=0.9,<1",
]

[project.scripts]
doubao-keyword-collector = "doubao2api.windows_entry:main"
doubao-account-manager = "doubao2api.__main__:main"
doubao2api = "doubao2api.__main__:main"
dkc = "doubao2api.windows_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doubao2api"]

[tool.hatch.build]
include = [
  "src/doubao2api/**/*.py",
  "src/doubao2api/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
